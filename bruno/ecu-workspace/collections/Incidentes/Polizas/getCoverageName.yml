    data: |-
      {
          "query": "query dictionary_list($params: Map_String_ObjectScalar, $locale: String) { dictionary_list(params: $params) { ...MessageResponseEntityFragment } }  fragment MessageResponseEntityFragment on MessageResponseEntity_Page_Dictionary { _type body { ...PageFragment } } fragment PageFragment on Page_Dictionary { totalElements content { ...C } } fragment C on Dictionary { _type id name module items (params: {locale: $locale }) { _type code category name locale id description orderNumber } }\n",
          "variables": {
              "params": {
                  "name_in": "CoverageName,CoverageGroup"
              },
              "locale": "ec"
          }
      }
  auth:
