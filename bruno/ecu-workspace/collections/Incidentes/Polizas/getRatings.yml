info:
  name: getRatings
  type: http
  seq: 12

http:
  method: POST
  url: "{{server}}/rule/api/v1/arizona/lookup_ratings/list"
  headers:
    - name: x-tenantid-1
      value: ec
  body:
    type: json
    data: |-
      {
          "_type": "LookupRatingRequest",
          "ratingListName": "INSURANCE_MATRIX",
          "fieldName": "assetType",
          "params": {
              "productType": "7"
          }
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
