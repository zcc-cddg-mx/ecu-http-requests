info:
  name: 2 --- (Renew) reminder_all_policies
  type: http
  seq: 2

http:
  method: POST
  url: "{{server}}/scheduler/api/v1/arizona/schedulers/motorAutomaticRenewalReminder/launch"
  headers:
    - name: x-tenantid-1
      value: ec
      disabled: true
    - name: x-create-tx
      value: "true"
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
