info:
  name: 1 Renew_all_policies
  type: http
  seq: 1

http:
  method: POST
  url: "{{server}}/scheduler/api/v1/arizona/schedulers/motorAutomaticRenewal/launch"
  headers:
    - name: x-tenantid-1
      value: ec
    - name: x-create-tx
      value: "true"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
