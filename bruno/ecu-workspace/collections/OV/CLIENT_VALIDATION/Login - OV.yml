runtime:
  scripts:
    - type: after-response
      code: |-
        var json = res.getBody();
        bru.setGlobalEnvVar("token", json.body.accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
