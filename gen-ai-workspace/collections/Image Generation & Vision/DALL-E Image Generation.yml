info:
  name: DALL-E Image Generation
  type: http
  seq: 1

http:
  method: POST
  url: "{{static_base_url}}/images/generations"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{generated_api_key}}
  body:
    type: json
    data: |-
      {
          "model": "dall-e-3",
          "prompt": "A professional modern insurance office with diverse team members helping customers, featuring clean design, natural lighting, and digital technology displays showing policy information and claims processing.",
          "n": 1,
          "size": "1024x1024",
          "quality": "standard",
          "response_format": "url"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 200\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });\r

        \r

        test(\"Image generation response\", function () {\r

        \    const responseData = res.getBody();\r

        \    expect(responseData).to.have.property('data');\r

        \    expect(responseData.data).to.be.an('array');\r

        \    expect(responseData.data[0]).to.have.property('url');\r

        });\r

        \r

        test(\"Response time acceptable\", function () {\r

        \    expect(res.getResponseTime()).to.be.below(15000);\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Generate professional images for insurance marketing materials
