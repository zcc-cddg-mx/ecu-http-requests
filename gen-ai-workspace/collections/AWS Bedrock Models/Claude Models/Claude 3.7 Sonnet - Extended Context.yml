info:
  name: Claude 3.7 Sonnet - Extended Context
  type: http
  seq: 2

http:
  method: POST
  url: "{{static_base_url}}/chat/completions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{generated_api_key}}
  body:
    type: json
    data: |-
      {
          "model": "claude-3-7-sonnet-20250219-v1:0",
          "messages": [
              {
                  "role": "user",
                  "content": "Write a comprehensive business continuity plan for a mid-sized insurance company. Include sections on: 1) Risk Assessment and Business Impact Analysis, 2) Emergency Response Procedures, 3) Recovery Strategies for Critical Business Functions, 4) Communication Plans, 5) Testing and Maintenance Procedures, 6) Vendor and Third-Party Risk Management, 7) Regulatory Compliance Considerations. Each section should be detailed with specific procedures and checklists."
              }
          ],
          "max_tokens": 3000,
          "temperature": 0.2
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 200\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });\r

        \r

        test(\"Extended context handling\", function () {\r

        \    const responseData = res.getBody();\r

        \    expect(responseData.usage.prompt_tokens).to.be.above(1000);\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Test Claude 3.7 Sonnet with 1M context window for comprehensive document generation
