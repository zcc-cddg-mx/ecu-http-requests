info:
  name: Claude Haiku - Fast Response
  type: http
  seq: 4

http:
  method: POST
  url: "{{static_base_url}}/chat/completions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{generated_api_key}}
  body:
    type: json
    data: |-
      {
          "model": "claude-3-haiku-20240307-v1:0",
          "messages": [
              {
                  "role": "user",
                  "content": "Quickly explain the difference between collision and comprehensive car insurance coverage."
              }
          ],
          "max_tokens": 200
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 200\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });\r

        \r

        test(\"Fast response time\", function () {\r

        \    expect(res.getResponseTime()).to.be.below(2000);\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Test Claude Haiku for fast, cost-effective responses
