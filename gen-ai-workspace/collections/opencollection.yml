opencollection: 1.0.0

info:
  name: GenAI - LiteLLM Samples
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: static_base_url
      value: https://genai-lounge-nx-litellm-uat-emea.zurich.com
    - name: generated_api_key
      value: sk-d6EA-z1n2VxlCi8VkX-iUg
  scripts:
    - type: before-request
      code: "// Set dynamic timestamp for unique requests\r

        bru.setGlobalEnvVar('timestamp', Date.now());"
    - type: after-response
      code: "// Global performance tracking\r

        const responseTime = res.getResponseTime();\r

        console.log('Request:', req.getName(), '- Response time:', responseTime, 'ms');\r

        \r

        // Log any errors for debugging\r

        if (res.getStatus() !== 200) {\r

        \    console.log('Error response:', JSON.stringify(res.getBody()));\r

        }"

docs:
  content: |-
    **STEP 3 of 3** - Comprehensive collection for testing LiteLLM API endpoints across Azure OpenAI, AWS Bedrock, and Google Gemini with tag-based routing and regional failover scenarios. Updated to reflect current multi-cloud deployment.

    **Sequential Workflow:**
    1. **Step 1 (COMPLETED):** Initial Setup - Creates org/team infrastructure ✅
    2. **Step 2 (COMPLETED):** Key Management - Generates user API keys ✅
    3. **Step 3 (THIS):** API Examples - Tests endpoints with generated keys

    **Prerequisites:**
    - **Steps 1 & 2 completed** - Infrastructure and API key must exist
    - Import appropriate environment file (dev/poc/uat/prod)
    - Run Key Management collection first to generate API key
    - API key will be automatically available as 'generated_api_key'

    **Usage:**
    This collection uses the API key generated by the Key Management collection. Ensure you run the collections in sequence:
    1. Step 1: Initial Setup collection (once per environment)
    2. Step 2: Key Management collection (generates API key)
    3. Step 3: This API Examples collection (tests endpoints)
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
