info:
  name: GPT-4o Enhanced Transcription
  type: http
  seq: 2

http:
  method: POST
  url: "{{static_base_url}}/audio/transcriptions"
  headers:
    - name: Authorization
      value: Bearer {{generated_api_key}}
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - path/to/audio/file.wav
        description: Replace with actual audio file path
      - name: model
        type: text
        value: gpt-4o-transcribe-20250320-global
      - name: language
        type: text
        value: en
      - name: response_format
        type: text
        value: json
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 200\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });\r

        \r

        test(\"Enhanced transcription response\", function () {\r

        \    const responseData = res.getBody();\r

        \    expect(responseData).to.have.property('text');\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Enhanced transcription using GPT-4o with context understanding
