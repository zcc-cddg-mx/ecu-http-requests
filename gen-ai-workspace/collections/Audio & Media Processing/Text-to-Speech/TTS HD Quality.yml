info:
  name: TTS HD Quality
  type: http
  seq: 2

http:
  method: POST
  url: "{{static_base_url}}/audio/speech"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{generated_api_key}}
  body:
    type: json
    data: |-
      {
          "model": "tts-1-hd",
          "input": "Thank you for choosing our comprehensive insurance package. Your policy provides extensive coverage including property damage, liability protection, and 24/7 emergency assistance.",
          "voice": "nova",
          "response_format": "mp3"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 200\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });\r

        \r

        test(\"HD audio content returned\", function() {\r

        \    expect(res.getSize()).to.be.above(2000);\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Generate high-definition audio for premium customer communications
