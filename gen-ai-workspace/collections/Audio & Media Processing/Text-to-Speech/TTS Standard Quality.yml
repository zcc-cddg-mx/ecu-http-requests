info:
  name: TTS Standard Quality
  type: http
  seq: 1

http:
  method: POST
  url: "{{static_base_url}}/audio/speech"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{generated_api_key}}
  body:
    type: json
    data: |-
      {
          "model": "tts-1",
          "input": "Welcome to our insurance services. Our team is here to help you find the right coverage for your needs. Please hold while we connect you with a specialist.",
          "voice": "alloy",
          "response_format": "mp3"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 200\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });\r

        \r

        test(\"Audio content returned\", function() {\r

        \    expect(res.getSize()).to.be.above(1000);\r

        });\r

        \r

        test(\"Response time acceptable\", function () {\r

        \    expect(res.getResponseTime()).to.be.below(8000);\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Generate speech audio for customer service scenarios
