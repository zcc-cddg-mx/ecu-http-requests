info:
  name: Health Check
  type: http
  seq: 1

http:
  method: GET
  url: "{{static_base_url}}/health"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{generated_api_key}}
  body:
    type: json
    data: |-
      {
          "model": "titan-embed-text-v1",
          "input": "Liability insurance protects businesses and individuals against claims resulting from injuries and damage to people or property caused by their actions or negligence."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

