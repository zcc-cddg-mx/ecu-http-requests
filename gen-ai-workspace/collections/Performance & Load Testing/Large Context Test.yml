info:
  name: Large Context Test
  type: http
  seq: 2

http:
  method: POST
  url: "{{static_base_url}}/chat/completions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{generated_api_key}}
  body:
    type: json
    data: |-
      {
          "model": "gpt-o1-20241217",
          "messages": [
              {
                  "role": "user",
                  "content": "Analyze this comprehensive insurance policy document and provide recommendations: [INSURANCE POLICY DOCUMENT] COMPREHENSIVE BUSINESS INSURANCE POLICY - Policy Number: CB-2024-789123 - Effective Date: January 1, 2024 - Expiration Date: January 1, 2025 - SECTION I: PROPERTY COVERAGE - Building Coverage: $2,000,000 - Business Personal Property: $500,000 - Loss of Business Income: $1,000,000 - Extra Expenses: $200,000 - SECTION II: LIABILITY COVERAGE - General Liability: $2,000,000 per occurrence, $4,000,000 aggregate - Product/Completed Operations: $2,000,000 per occurrence, $4,000,000 aggregate - Personal & Advertising Injury: $1,000,000 per person or organization - Medical Expenses: $10,000 per person - SECTION III: CYBER LIABILITY - Data Breach Response: $1,000,000 - Cyber Extortion: $500,000 - Business Interruption: $2,000,000 - SECTION IV: WORKERS COMPENSATION - Statutory limits as required by state law - Employers Liability: $500,000 each accident, $500,000 disease policy limit, $500,000 disease each employee - SECTION V: AUTO LIABILITY - Combined Single Limit: $1,000,000 - Comprehensive and Collision: Actual Cash Value minus $1,000 deductible - EXCLUSIONS: War, nuclear hazards, intentional acts, pollution (unless specifically covered), wear and tear, mechanical breakdown, dishonest acts by employees (unless specifically covered), earthquake and flood (unless specifically covered). DEDUCTIBLES: Property: $5,000, General Liability: $0, Cyber: $10,000, Workers Comp: $0, Auto Physical Damage: $1,000. Based on this policy, what gaps in coverage should be addressed and what additional protections would you recommend for a manufacturing company with 150 employees?"
              }
          ],
          "max_tokens": 2000
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 200\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });\r

        \r

        test(\"Large context handling\", function () {\r

        \    const responseData = res.getBody();\r

        \    expect(responseData.usage.prompt_tokens).to.be.above(2000);\r

        \    console.log('Prompt tokens used:', responseData.usage.prompt_tokens);\r

        });\r

        \r

        test(\"Response time for large context\", function () {\r

        \    expect(res.getResponseTime()).to.be.below(20000);\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Test handling of large context documents for complex analysis
