info:
  name: Concurrent Requests Test
  type: http
  seq: 1

http:
  method: POST
  url: "{{static_base_url}}/chat/completions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{generated_api_key}}
  body:
    type: json
    data: |-
      {
          "model": "gpt-35-turbo",
          "messages": [
              {
                  "role": "user",
                  "content": "Load test request {{$randomUUID}}: What are the main types of business insurance?"
              }
          ],
          "max_tokens": 300
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 200\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });\r

        \r

        test(\"Concurrent processing performance\", function () {\r

        \    expect(res.getResponseTime()).to.be.below(10000);\r

        \    console.log('Concurrent request response time:', res.getResponseTime(), 'ms');\r

        });\r

        \r

        test(\"Response quality maintained\", function () {\r

        \    const responseData = res.getBody();\r

        \    expect(responseData.choices[0].message.content.length).to.be.above(50);\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Test for concurrent load with unique identifiers - run multiple times simultaneously
