info:
  name: Batch Embeddings
  type: http
  seq: 3

http:
  method: POST
  url: "{{static_base_url}}/embeddings"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{generated_api_key}}
  body:
    type: json
    data: |-
      {
          "model": "text-embedding-3-large",
          "input": [
              "Auto insurance is mandatory in most jurisdictions and covers vehicle-related damages and liabilities.",
              "Health insurance provides coverage for medical expenses, preventive care, and prescription medications.",
              "Life insurance offers financial protection to beneficiaries in the event of the policyholder's death."
          ],
          "encoding_format": "float"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 200\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });\r

        \r

        test(\"Batch embedding response\", function () {\r

        \    const responseData = res.getBody();\r

        \    expect(responseData.data).to.have.lengthOf(3);\r

        \    responseData.data.forEach((item, index) => {\r

        \        expect(item).to.have.property('embedding');\r

        \        expect(item.embedding).to.be.an('array');\r

        \        expect(item.index).to.equal(index);\r

        \    });\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Test batch embedding generation for multiple insurance-related texts
