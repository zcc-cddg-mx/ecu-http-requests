info:
  name: GPT-4o Text Generation
  type: http
  seq: 1

http:
  method: POST
  url: "{{static_base_url}}/chat/completions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{generated_api_key}}
  body:
    type: json
    data: |-
      {
          "model": "gpt-4o-20241120-global",
          "messages": [
              {
                  "role": "system",
                  "content": "You are an expert insurance consultant specializing in risk assessment and policy recommendations."
              },
              {
                  "role": "user",
                  "content": "What are the key considerations for insuring a tech startup with remote employees across multiple countries?"
              }
          ],
          "max_tokens": 800,
          "temperature": 0.4
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 200\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });\r

        \r

        test(\"Response has expected structure\", function () {\r

        \    const responseData = res.getBody();\r

        \    expect(responseData).to.have.property('choices');\r

        \    expect(responseData.choices[0].message).to.have.property('content');\r

        });\r

        \r

        test(\"Response time is acceptable\", function () {\r

        \    expect(res.getResponseTime()).to.be.below(5000);\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Test GPT-4o global model for insurance consulting scenarios
