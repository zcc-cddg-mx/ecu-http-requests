info:
  name: GPT-4o Streaming
  type: http
  seq: 3

http:
  method: POST
  url: "{{static_base_url}}/chat/completions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{generated_api_key}}
  body:
    type: json
    data: |-
      {
          "model": "gpt-4o-20241120-global",
          "messages": [
              {
                  "role": "user",
                  "content": "Write a comprehensive risk assessment report for a manufacturing company considering expansion into renewable energy. Include market analysis, regulatory considerations, and operational risks."
              }
          ],
          "max_tokens": 1500,
          "stream": true,
          "temperature": 0.3
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 200\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });\r

        \r

        test(\"Response is in SSE format\", function () {\r

        \    const responseText = JSON.stringify(res.getBody());\r

        \    expect(responseText).to.include('data:');\r

        });\r

        \r

        test(\"Response time is acceptable\", function () {\r

        \    expect(res.getResponseTime()).to.be.below(8000);\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Test streaming response with GPT-4o for long-form content generation
