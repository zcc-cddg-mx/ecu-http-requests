info:
  name: GPT-3.5 Turbo Standard
  type: http
  seq: 1

http:
  method: POST
  url: "{{static_base_url}}/chat/completions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{generated_api_key}}
  body:
    type: json
    data: |-
      {
          "model": "gpt-35-turbo",
          "messages": [
              {
                  "role": "user",
                  "content": "What are the main types of car insurance coverage?"
              }
          ],
          "max_tokens": 300
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 200\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });\r

        \r

        test(\"Fast response time\", function () {\r

        \    expect(res.getResponseTime()).to.be.below(3000);\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Test GPT-3.5 Turbo for quick, cost-effective responses
