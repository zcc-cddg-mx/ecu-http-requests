info:
  name: GPT-O1 with EMEA Tag
  type: http
  seq: 3

http:
  method: POST
  url: "{{static_base_url}}/chat/completions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{generated_api_key}}
    - name: x-litellm-tags
      value: EMEA,sweden-central
  body:
    type: json
    data: |-
      {
          "model": "gpt-o1-20241217",
          "messages": [
              {
                  "role": "user",
                  "content": "Calculate the compound interest on €100,000 invested at 3.5% annually for 25 years, considering European tax implications."
              }
          ],
          "tags": ["EMEA", "sweden-central"],
          "max_tokens": 1000
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 200\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });\r

        \r

        test(\"Verify EMEA routing\", function () {\r

        \    const responseHeaders = res.getHeaders();\r

        \    // Check for EMEA-specific indicators in response\r

        \    console.log('All response headers:', responseHeaders);\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Test tag-based routing to EMEA region (Sweden Central) for GPT-O1
